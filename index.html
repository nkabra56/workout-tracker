<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#010204" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>Lifty · Workout journal</title>
  </head>
  <body>
    <header>
      <a class="brand" href="#today"
        ><img src="/icon.svg" width="36" height="36" alt="" />Lifty</a
      ><span id="status" role="status">Opening local journal…</span>
    </header>
    <main id="app"></main>
    <nav aria-label="Main navigation">
      <a href="#today"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M7 3v4m10-4v4M3 11h18" /></svg
        ><span>Today</span></a
      ><a href="#workout"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 9v6m12-6v6M3 8v8m18-8v8M6 12h12" /></svg
        ><span>Train</span></a
      ><a href="#progress"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 19V5m0 14h17M7 14l4-4 4 2 5-7" /></svg
        ><span>Progress</span></a
      >
    </nav>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
